[workspace]
authors = ["Chen Zhang <zhangc@ornl.gov>"]
channels = ["conda-forge", "neutronimaging", "oncat"]
name = "python_notebooks_development"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

# Base dependencies (always included)
[dependencies]
python = "*"
requests = "*"
requests-oauthlib = "*"

# ============================================
# Feature: Scientific Computing
# ============================================
[feature.scientific]
[feature.scientific.dependencies]
astropy = "*"
scipy = "*"
pandas = "*"
scikit-image = "*"
h5py = "*"
lmfit = "*"
pillow = "*"

# ============================================
# Feature: Supporting Libraries
# ============================================
[feature.support]
[feature.support.dependencies]
poco = "*"

# ============================================
# Feature: Visualization
# ============================================
[feature.viz]
[feature.viz.dependencies]
matplotlib = "*"
plotly = "*"
dash = "*"

# ============================================
# Feature: Jupyter and Notebooks
# ============================================
[feature.jupyter]
[feature.jupyter.dependencies]
jupyterlab = "*"
ipympl = "*"
ipywidgets = "*"
jupytext = "*"
nbstripout = "*"

[feature.jupyter.tasks]
lab = "jupyter lab"
notebook = "jupyter notebook"
build_extensions = """
jupyter labextension install @jupyter-widgets/jupyterlab-manager && 
jupyter nbextension enable --py widgetsnbextension && 
jupyter lab build
"""

# ============================================
# Feature: Excel Support
# ============================================
[feature.excel]
[feature.excel.dependencies]
xlrd = "*"
openpyxl = "*"
xlsxwriter = "*"

# ============================================
# Feature: Qt and GUI
# ============================================
[feature.gui]
[feature.gui.dependencies]
qt = "*"
qtpy = "*"
pyqt = "*"
pyqtgraph = "*"

# ============================================
# Feature: Utilities
# ============================================
[feature.utils]
[feature.utils.dependencies]
inflect = "*"
werkzeug = "*"
tqdm = "*"
pyoncat = "*"

# ============================================
# Feature: Testing
# ============================================
[feature.test]
[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = "cd notebooks && export PYTHONPATH=$PWD:$PYTHONPATH && pytest"
test_imports = """python -c '
packages = [
    "astropy",
    "scipy",
    "pandas",
    "skimage",
    "h5py",
    "lmfit",
    "matplotlib",
    "plotly",
    "dash",
    "jupyterlab",
    "ipympl",
    "ipywidgets",
    "jupytext",
    "nbstripout",
    "xlrd",
    "openpyxl",
    "xlsxwriter",
    "PyQt5",
    "pyqtgraph",
    "tqdm",
    "pyoncat",
    "pytest",
    "neunorm",
    "neutronbraggedge",
    "ImagingReso",
    "changepy",
    "sectorizedradialprofile",
    "ipywe"
]

import sys
failed = []
for pkg in packages:
    try:
        if pkg == "skimage":
            __import__("skimage")
        elif pkg == "PyQt5":
            __import__("PyQt5")
        elif pkg == "neunorm":
            __import__("NeuNorm")
        elif pkg == "ImagingReso":
            __import__("ImagingReso")
        else:
            __import__(pkg)
        print(f"✓ {pkg}")
    except ImportError as e:
        print(f"✗ {pkg}: {e}")
        failed.append(pkg)

if failed:
    print(f"\\nFailed to import: {failed}")
    sys.exit(1)
else:
    print("\\nAll packages imported successfully!")
'"""

# ============================================
# Feature: Development
# ============================================
[feature.dev]
[feature.dev.dependencies]
pre-commit = "*"
ruff = "*"

[feature.dev.tasks]
lint = "ruff check notebooks/"
format = "ruff format notebooks/"
clean = "python notebooks/_before_and_after_github_script.py -b"
restore = "python notebooks/_before_and_after_github_script.py -a"

# ============================================
# PyPI Dependencies (all environments)
# ============================================
[pypi-dependencies]
neunorm = "*"
changepy = { git = "https://github.com/JeanBilheux/changepy" }
ipywe = "*"
neutronbraggedge = "*"
sectorizedradialprofile = "*"
imagingreso = "*"

# ============================================
# Environments
# ============================================
[environments]
# Default environment includes all features
default = { features = ["scientific", "support", "viz", "jupyter", "excel", "gui", "utils", "test"], solve-group = "default" }

# Development environment includes everything plus dev tools
dev = { features = ["scientific", "support", "viz", "jupyter", "excel", "gui", "utils", "test", "dev"], solve-group = "default" }

# Minimal environment for CI/CD or lightweight usage
minimal = { features = ["scientific", "utils", "test"], solve-group = "minimal" }

# Jupyter-only environment
jupyter = { features = ["scientific", "viz", "jupyter", "utils"], solve-group = "jupyter" }

# ============================================
# Global Tasks (available in all environments)
# ============================================
[tasks]
# Installation check
check = "python util/installation_check.py"

# Combined test task
test_all = { depends-on = ["test_imports", "test"] }