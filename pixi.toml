[workspace]
authors = ["Chen Zhang <zhangc@ornl.gov>"]
channels = ["neutronimaging", "oncat", "conda-forge"]
name = "python_notebooks_development"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.3,<3.15"
# imars3d = ">=1.3.0,<2"
plotly = ">=6.5.2,<7"
pyqtgraph = ">=0.14.0,<0.15"
nexusformat = ">=2.0.1,<3"
jupyterlab = ">=4.5.4,<5"
ipympl = ">=0.10.0,<0.11"
requests-oauthlib = ">=2.0.0,<3"
lmfit = ">=1.3.4,<2"
neunorm = ">=1.6.12,<2"
poco = ">=1.14.2,<2"
dash = ">=4.0.0,<5"
jupytext = ">=1.19.1,<2"
nbstripout = ">=0.9.0,<0.10"
xlrd = ">=2.0.2,<3"
openpyxl = ">=3.1.5,<4"
xlsxwriter = ">=3.2.9,<4"
qtpy = ">=2.4.3,<3"
pyqt = ">=5.15.11,<6"
inflect = ">=7.5.0,<8"
pyoncat = ">=2.1,<3"
numpy = ">=2.4.2,<3"
jupyter = ">=1.1.1,<2"
pleiades-neutron = ">=2.1.5,<3"
ipysheet = ">=0.7.0,<0.8"
python-dotenv = ">=1.2.1,<2"
openssl = ">=3.6.1,<4"
olefile = ">=0.47,<0.48"
pytest = ">=9.0.2,<10"

[pypi-dependencies]
bem = ">=1.0.0, <2"
changepy = { git = "https://github.com/JeanBilheux/changepy" }
neutronbraggedge = ">=2.0.6, <3"
sectorizedradialprofile = ">=1.1.2, <2"
imagingreso = ">=1.8.0, <2"
timepix-geometry-correction = { git = "https://github.com/ornlneutronimaging/timepix_geometry_correction.git", branch="main"}

[target.linux-64.pypi-dependencies]
mbirjax = { version = ">=0.6.7, <0.7", extras = ["cuda12"] }
